name: Stock EMA Monitor

on:
  schedule:
    # 15 minutes after NYSE open = 9:45 AM ET, Mon–Fri.
    # GitHub Actions cron runs on UTC and does not observe DST, so we list
    # both the EDT and EST translations. The check-time job below ensures
    # the real work only runs when the current ET wall-clock is 09:45.
    - cron: '45 13 * * 1-5'  # 09:45 EDT  (mid-Mar → early Nov)
    - cron: '45 14 * * 1-5'  # 09:45 EST  (early Nov → mid-Mar)
  workflow_dispatch: # allow manual trigger from Actions tab

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check ET wall-clock
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ET_HM=$(TZ='America/New_York' date +'%H:%M')
          echo "Current ET time: $ET_HM"
          if [ "$ET_HM" = "09:45" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 09:45 ET — skipping this scheduled run"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  run-monitor:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run EMA monitor
        run: node monitor.js
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
